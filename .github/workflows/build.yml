name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Cordova
        run: npm install -g cordova@12

      - name: ➕ Add Android platform
        run: cordova platform add android@13.0.0

      - name: 🔨 Build debug APK
        run: cordova build android --debug

      - name: 🏷️ Rename APK
        run: |
          APK=$(find platforms/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          mkdir -p dist
          cp "$APK" dist/Geez-Calculator.apk
          ls -lh dist

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Geez-Calculator-APK
          path: dist/Geez-Calculator.apk
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Geez-Calculator.apk
